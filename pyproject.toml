[project]
name = "geomechpy"
version = "0.0.1"
license = "LGPL-3.0-only"
description = "The geomechpy Python library aims to provide a comprehensive set of functions to build a Geomechanics workflow"
authors = [
    {name = "Florian Karpfinger"},
    {name = "Alex Kutuev", email = "kutuev93@yandex.ru"}
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "bump-my-version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "0.0.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "geomechpy/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'